# Checks, then deployment to Azure App Service.
#
#   verify: unit tests, blueprint, SQL and document regeneration, conventions, comparison with Salesforce data, app smoke test
#   deploy: package target/app, deploy to crmgenie-app-hg01, health check (main branch only)
#
# Generated files are committed. The pipeline regenerates them and fails if they differ, so the
# deployed code is the code that was reviewed.
name: CRM Genie

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: crm-genie-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  APP_NAME: crmgenie-app-hg01

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            src/verification/package-lock.json
            src/app/package-lock.json

      - name: Install
        run: |
          npm ci --prefix src/verification --no-fund --no-audit
          npm ci --prefix src/app --omit=dev --no-fund --no-audit
          # The migration console ships inside the app; it is copied in, not versioned twice.
          cp src/console/org-compiler.html src/app/public/compiler.html

      - name: Unit tests
        run: node --test "src/generators/test/*.test.js"

      - name: Rebuild and validate blueprint
        run: |
          node src/generators/normalise-blueprint.js
          node src/generators/validate-blueprint.js
          git diff --exit-code -- adlc/2-design/modelling/blueprint

      - name: Regenerate SQL
        run: |
          node src/generators/emit-postgres.js
          git diff --exit-code -- adlc/3-build

      - name: Regenerate documents, evals and ADLC index
        run: |
          node src/generators/emit-cutover.js
          node src/generators/emit-docs.js
          node src/generators/emit-assessment.js
          node src/generators/emit-discovery.js
          node src/generators/emit-evals.js
          node src/generators/emit-adlc-index.js
          node src/generators/emit-console.js
          git diff --exit-code -- adlc evals src/console

      - name: Conventions
        run: node src/generators/check-conventions.js

      - name: Compare with Salesforce data
        working-directory: src/verification
        run: node run.js

      - name: App smoke test
        working-directory: src/verification
        run: node app-smoke.mjs

      - name: Parity report
        if: always()
        run: cat adlc/5-validate/verification/report.md >> "$GITHUB_STEP_SUMMARY" || true

  deploy:
    name: Deploy
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: azure-dev
      url: https://crmgenie-app-hg01.azurewebsites.net
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Package
        run: |
          cp src/console/org-compiler.html src/app/public/compiler.html
          npm ci --prefix src/app --omit=dev --no-fund --no-audit
          cd src/app && zip -qr "$GITHUB_WORKSPACE/crmgenie.zip" . -x 'scripts/*'

      - name: Deploy to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: crmgenie.zip

      - name: Health check
        run: |
          for i in $(seq 1 30); do
            if curl -fsS https://${{ env.APP_NAME }}.azurewebsites.net/health; then echo; exit 0; fi
            sleep 10
          done
          echo "health check failed" && exit 1
