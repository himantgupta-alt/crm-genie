<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CRM Genie · Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/app.css">
<style>
  .login { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
  .login form { width: min(380px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 28px; display: grid; gap: 14px; }
  .login .brand { justify-content: center; font-size: 20px; }
  .login .mark { width: 34px; height: 34px; }
  .login p.sub { text-align: center; color: var(--muted); font-size: 13px; }
  .login label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
  .login input { border: 1px solid var(--line-strong); border-radius: 6px; padding: 9px 10px; background: var(--surface); }
  .login .btn { padding: 9px; font-size: 15px; }
  .login .foot { text-align: center; font-size: 12px; color: var(--faint); }
</style>
</head>
<body>
<main class="login">
  <form id="f" novalidate>
    <span class="brand"><span class="mark" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 18 18"><path d="M9 1.5l1.9 4.6 4.6 1.9-4.6 1.9L9 14.5l-1.9-4.6L2.5 8l4.6-1.9z" fill="currentColor"/></svg></span>CRM Genie</span>
    <p class="sub">Subscriptions, compiled from Salesforce and running on Azure</p>
    <div id="err"></div>
    <label for="u">Username<input id="u" name="username" autocomplete="username" required autofocus></label>
    <label for="p">Password<input id="p" name="password" type="password" autocomplete="current-password" required></label>
    <button class="btn primary" type="submit">Log In</button>
    <p class="foot">Ascendion · AZAP-agentic-finance</p>
  </form>
</main>
<script src="/login.js"></script>
</body>
</html>
